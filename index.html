<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioHome SpA | Tender Hub Pro</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; opacity: 0; transition: opacity 0.5s; }
        .sidebar-link { cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; transition: 0.2s; }
        .sidebar-link.active { background: #1e1b4b; color: white; border-left: 4px solid #ef4444; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        .status-select { background: transparent; border: none; font-weight: 700; font-size: 0.7rem; cursor: pointer; outline: none; }
    </style>
</head>
<body class="bg-[#f8fafc] text-slate-800">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-72 bg-[#0f172a] text-slate-400 flex flex-col shadow-2xl z-20">
            <div class="p-8 mb-4 flex items-center gap-3">
                <img src="logo.png" alt="CardioHome" class="w-12 h-12 bg-white rounded-xl p-1">
                <div>
                    <h1 class="text-white font-black text-lg leading-none">CARDIOHOME</h1>
                    <span class="text-[9px] text-red-500 font-bold tracking-widest uppercase">Tender System</span>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-1">
                <div onclick="switchView('dashboard')" id="nav-dashboard" class="sidebar-link active">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i> Dashboard
                </div>
                <div onclick="switchView('ordenes')" id="nav-ordenes" class="sidebar-link">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i> Órdenes de Compra
                </div>
                <div onclick="switchView('legal')" id="nav-legal" class="sidebar-link">
                    <i data-lucide="briefcase" class="w-5 h-5"></i> Documentos Legales
                </div>
                <div onclick="switchView('staff')" id="nav-staff" class="sidebar-link">
                    <i data-lucide="users" class="w-5 h-5"></i> Documentos Staff
                </div>
                <div onclick="switchView('ia')" id="nav-ia" class="sidebar-link mt-6 border border-indigo-500/20">
                    <i data-lucide="bot" class="w-5 h-5 text-indigo-400"></i> Analizador IA
                </div>
            </nav>

            <div class="p-6 border-t border-slate-800">
                <button onclick="logout()" class="flex items-center gap-3 p-3 w-full text-red-400 hover:bg-red-500/10 rounded-xl transition font-bold">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-20 bg-white border-b border-slate-200 flex items-center justify-between px-10">
                <h2 id="view-title" class="font-black text-xl text-slate-800 uppercase tracking-tighter">Dashboard</h2>
                <button onclick="openModal('modal-licitacion')" class="bg-red-600 hover:bg-red-700 text-white px-6 py-2.5 rounded-xl font-bold shadow-lg flex items-center gap-2">
                    <i data-lucide="plus-circle" class="w-4 h-4"></i> Nueva Licitación
                </button>
            </header>

            <section id="view-dashboard" class="view-section active p-10 overflow-y-auto">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-10">
                    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm">
                        <p class="text-xs font-bold text-slate-400 uppercase">Total Adjudicado</p>
                        <h3 id="kpi-monto" class="text-3xl font-black text-green-600 font-mono">$0</h3>
                    </div>
                    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm text-center">
                        <p class="text-xs font-bold text-slate-400 uppercase">Licitaciones</p>
                        <h3 id="kpi-count" class="text-3xl font-black text-indigo-600">0</h3>
                    </div>
                    <div class="bg-white p-8 rounded-3xl border border-slate-200 shadow-sm text-right">
                        <p class="text-xs font-bold text-slate-400 uppercase">Eficiencia</p>
                        <h3 class="text-3xl font-black text-slate-800">100%</h3>
                    </div>
                </div>

                <div class="bg-white rounded-[2rem] border border-slate-200 shadow-xl overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-black text-slate-400 uppercase">
                            <tr>
                                <th class="px-8 py-5">Licitación / ID</th>
                                <th class="px-8 py-5">Área</th>
                                <th class="px-8 py-5">Presupuesto</th>
                                <th class="px-8 py-5">Estatus (Manual)</th>
                                <th class="px-8 py-5 text-center">Simulador</th>
                            </tr>
                        </thead>
                        <tbody id="tender-table-body" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </section>

            <section id="view-files" class="view-section p-10 overflow-y-auto">
                <div class="bg-white p-8 rounded-[2rem] border border-slate-200 mb-8 flex flex-col md:flex-row justify-between items-center gap-6 shadow-sm">
                    <div id="staff-folders" class="hidden flex gap-2">
                        <button onclick="changeFolder('staff/neurologia')" class="bg-slate-100 px-4 py-2 rounded-xl text-xs font-bold">Neurología</button>
                        <button onclick="changeFolder('staff/pediatria')" class="bg-slate-100 px-4 py-2 rounded-xl text-xs font-bold">Pediatría</button>
                        <button onclick="changeFolder('staff/familiar')" class="bg-slate-100 px-4 py-2 rounded-xl text-xs font-bold">Familiar</button>
                    </div>
                    <div class="flex gap-4 w-full md:w-auto">
                        <input type="text" id="file-title" placeholder="Título del documento (Ej: OC 123 - Hospital)" class="flex-1 p-3 bg-slate-50 border rounded-xl outline-none text-xs font-bold focus:border-indigo-500">
                        <input type="file" id="file-input" class="hidden" accept=".pdf" onchange="uploadFile()">
                        <button onclick="triggerUpload()" class="bg-[#0f172a] text-white px-8 py-3 rounded-xl font-bold flex items-center gap-2 shadow-lg">
                            <i data-lucide="upload-cloud"></i> Subir PDF
                        </button>
                    </div>
                </div>
                <div id="file-grid" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
            </section>

            <section id="view-ia" class="view-section p-10 overflow-y-auto">
                </section>
        </main>
    </div>

    <div id="modal-simulador" class="hidden fixed inset-0 bg-slate-900/90 backdrop-blur-md flex items-center justify-center z-50 p-6">
        <div class="bg-white rounded-[3rem] max-w-4xl w-full p-10 shadow-2xl flex flex-col md:flex-row gap-10">
            <div class="flex-1 space-y-6">
                <h3 class="text-3xl font-black text-slate-900" id="sim-nombre">Simulador</h3>
                <div class="space-y-4">
                    <div class="group">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Honorarios Médicos</label>
                        <input type="number" id="gasto-medico" oninput="calculate()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-red-500 outline-none font-bold" value="0">
                    </div>
                    <div class="group">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Traslado y Alojamiento</label>
                        <input type="number" id="gasto-logistica" oninput="calculate()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-red-500 outline-none font-bold" value="0">
                    </div>
                    <div class="group">
                        <label class="text-[10px] font-bold text-slate-400 uppercase ml-1">Otros Gastos / Viáticos</label>
                        <input type="number" id="gasto-otros" oninput="calculate()" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl focus:border-red-500 outline-none font-bold" value="0">
                    </div>
                </div>
                <button onclick="closeModal('modal-simulador')" class="w-full text-slate-400 font-bold uppercase py-4">Volver al Dashboard</button>
            </div>
            <div class="w-full md:w-80 bg-[#0f172a] rounded-[2.5rem] p-10 text-white text-center flex flex-col justify-center shadow-2xl">
                <p class="text-slate-400 text-xs font-bold uppercase mb-2">Utilidad Proyectada</p>
                <h4 class="text-4xl font-black text-green-400" id="sim-resultado">$0</h4>
                <div class="w-full bg-slate-800 h-2 rounded-full mt-6 overflow-hidden">
                    <div id="sim-bar" class="bg-green-500 h-full transition-all duration-700" style="width: 0%"></div>
                </div>
            </div>
        </div>
    </div>

    <div id="modal-licitacion" class="hidden fixed inset-0 bg-slate-900/80 flex items-center justify-center z-50 p-6">
        <div class="bg-white rounded-[2.5rem] max-w-lg w-full p-10 shadow-2xl">
            <h3 class="text-2xl font-black mb-6">Ingresar Licitación</h3>
            <form id="tender-form" class="space-y-4">
                <input type="text" id="t-nombre" placeholder="Nombre de la Institución" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none" required>
                <input type="text" id="t-id" placeholder="ID Mercado Público" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none" required>
                <input type="number" id="t-monto" placeholder="Monto Total Adjudicado" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none" required>
                <select id="t-eval" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none font-bold"><option>Neurología</option><option>Pediatría</option><option>Familiar</option></select>
                <div class="flex gap-4 pt-6">
                    <button type="button" onclick="closeModal('modal-licitacion')" class="flex-1 font-bold text-slate-400">Cancelar</button>
                    <button type="submit" class="flex-1 bg-red-600 text-white p-4 rounded-2xl font-bold shadow-xl">Guardar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
