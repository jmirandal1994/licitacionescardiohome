<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>CardioHome SpA | Mobile</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; opacity: 0; transition: opacity 0.6s ease; -webkit-tap-highlight-color: transparent; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        /* Ajustes Sidebar Móvil */
        #sidebar { transition: transform 0.3s ease-in-out; }
        @media (max-width: 768px) {
            #sidebar { transform: translateX(-100%); position: fixed; height: 100%; z-index: 50; }
            #sidebar.open { transform: translateX(0); }
            .mobile-bottom-nav { display: flex; }
            /* Transformar tabla en tarjetas */
            #tender-table-body tr { display: flex; flex-direction: column; padding: 15px; border-bottom: 8px solid #f1f5f9; }
            #tender-table-body td { display: block; padding: 5px 0; text-align: left !important; border: none; }
            thead { display: none; }
        }

        .sidebar-item.active { background: #f8fafc; color: #ef4444; border-left: 4px solid #ef4444; font-weight: 700; }
        .glass-header { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(10px); position: sticky; top: 0; z-index: 30; }
    </style>
</head>
<body class="bg-[#fcfdfe] text-[#1e293b]">

    <div class="flex h-screen overflow-hidden relative">
        <aside id="sidebar" class="w-72 bg-white border-r border-slate-200 flex flex-col">
            <div class="p-8 flex items-center justify-between">
                <div class="flex items-center gap-3">
                    <div class="w-8 h-8 bg-red-500 rounded-lg"></div>
                    <h1 class="font-bold text-sm tracking-tight">CardioHome</h1>
                </div>
                <button onclick="toggleMenu()" class="md:hidden text-slate-400"><i data-lucide="x"></i></button>
            </div>

            <nav class="flex-1 px-4 space-y-1">
                <div onclick="switchView('dashboard')" id="nav-dashboard" class="sidebar-item active p-4 rounded-xl">
                    <i data-lucide="layout-grid" class="w-5 h-5"></i> <span class="text-sm">Dashboard</span>
                </div>
                <div onclick="switchView('ordenes')" id="nav-ordenes" class="sidebar-item p-4 rounded-xl">
                    <i data-lucide="shopping-bag" class="w-5 h-5"></i> <span class="text-sm">Órdenes</span>
                </div>
                <div onclick="switchView('legal')" id="nav-legal" class="sidebar-item p-4 rounded-xl">
                    <i data-lucide="scale" class="w-5 h-5"></i> <span class="text-sm">Legal</span>
                </div>
                <div onclick="switchView('staff')" id="nav-staff" class="sidebar-item p-4 rounded-xl">
                    <i data-lucide="users" class="w-5 h-5"></i> <span class="text-sm">Staff</span>
                </div>
                <div onclick="switchView('ia')" id="nav-ia" class="sidebar-item p-4 rounded-xl mt-4 bg-indigo-50 text-indigo-600 font-bold">
                    <i data-lucide="sparkles" class="w-5 h-5"></i> <span class="text-sm">Analizador IA</span>
                </div>
            </nav>

            <div class="p-6 border-t border-slate-100">
                <button onclick="logout()" class="flex items-center gap-3 text-xs font-bold text-red-500">
                    <i data-lucide="power" class="w-4 h-4"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-16 md:h-20 glass-header border-b flex items-center justify-between px-6 md:px-10 shadow-sm">
                <div class="flex items-center gap-4">
                    <button onclick="toggleMenu()" class="md:hidden p-2 bg-slate-100 rounded-lg">
                        <i data-lucide="menu" class="w-5 h-5"></i>
                    </button>
                    <h2 id="view-title" class="font-bold text-sm md:text-lg uppercase">Dashboard</h2>
                </div>
                <button onclick="openModal('modal-licitacion')" class="bg-slate-900 text-white p-2 md:px-6 md:py-2.5 rounded-xl text-[10px] font-bold">
                    + <span class="hidden md:inline">Nueva Licitación</span>
                </button>
            </header>

            <div class="flex-1 overflow-y-auto pb-20 md:pb-0">
                <section id="view-dashboard" class="view-section active p-6 md:p-10">
                    <div class="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm col-span-2 md:col-span-1">
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1">Monto Adjudicado</p>
                            <h3 id="kpi-monto" class="text-2xl font-bold text-slate-900">$0</h3>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1">Procesos</p>
                            <h3 id="kpi-count" class="text-2xl font-bold text-slate-900">0</h3>
                        </div>
                        <div class="bg-white p-4 rounded-2xl border border-slate-100 shadow-sm text-center">
                            <p class="text-[9px] font-bold text-slate-400 uppercase tracking-widest mb-1">Status</p>
                            <div class="flex items-center justify-center gap-1 text-emerald-500 font-bold text-xs uppercase">Live</div>
                        </div>
                    </div>

                    <div class="bg-white rounded-2xl md:rounded-3xl border border-slate-100 shadow-xl overflow-hidden">
                        <table class="w-full">
                            <thead class="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase tracking-widest border-b">
                                <tr>
                                    <th class="px-8 py-5">Institución</th>
                                    <th class="px-8 py-5 text-center">Gestión</th>
                                    <th class="px-8 py-5">Monto</th>
                                    <th class="px-8 py-5">Estatus</th>
                                    <th class="px-8 py-5">Acciones</th>
                                </tr>
                            </thead>
                            <tbody id="tender-table-body" class="divide-y divide-slate-100 text-sm"></tbody>
                        </table>
                    </div>
                </section>

                <section id="view-files" class="view-section p-6">
                    <div class="bg-white p-6 rounded-2xl border border-slate-100 mb-6 flex flex-col gap-4">
                        <input type="text" id="file-title" placeholder="Título del archivo" class="w-full p-4 bg-slate-50 border rounded-xl text-sm">
                        <input type="file" id="file-input" class="hidden" accept=".pdf" onchange="uploadFile()">
                        <button onclick="triggerUpload()" class="bg-slate-900 text-white w-full py-4 rounded-xl font-bold text-xs uppercase">Subir PDF</button>
                    </div>
                    <div id="file-grid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
                </section>

                <section id="view-ia" class="view-section p-6">
                    <div class="bg-slate-900 p-8 rounded-3xl text-center mb-6">
                        <i data-lucide="bot" class="w-12 h-12 text-white mx-auto mb-4"></i>
                        <h3 class="text-white font-bold mb-4">Analizador IA</h3>
                        <input type="file" id="ia-file" class="hidden" accept=".pdf" onchange="analyzePDF()">
                        <button onclick="document.getElementById('ia-file').click()" class="bg-indigo-600 text-white px-8 py-3 rounded-xl text-xs font-bold uppercase w-full">Analizar Bases</button>
                    </div>
                    <div id="ia-loading" class="hidden p-10 text-center animate-pulse text-indigo-600 font-bold uppercase text-xs">Procesando...</div>
                    <div id="ia-result" class="hidden space-y-4">
                        <div id="ia-detailed-report" class="bg-white p-6 rounded-2xl border-l-4 border-indigo-500 shadow-sm text-sm italic"></div>
                    </div>
                </section>
            </div>
        </main>
    </div>

    <div id="modal-licitacion" class="hidden fixed inset-0 bg-white md:bg-slate-900/40 z-50 p-6 md:p-12 overflow-y-auto">
        <div class="max-w-xl mx-auto bg-white rounded-2xl p-4 md:p-10 shadow-2xl">
            <h3 class="font-bold text-lg mb-6">NUEVA LICITACIÓN</h3>
            <form id="tender-form" class="space-y-4">
                <input type="text" id="t-nombre" placeholder="Institución" class="w-full p-4 bg-slate-50 border rounded-xl" required>
                <input type="text" id="t-id" placeholder="ID Mercado Público" class="w-full p-4 bg-slate-50 border rounded-xl" required>
                <input type="number" id="t-monto" placeholder="Monto CLP" class="w-full p-4 bg-slate-50 border rounded-xl" required>
                <div id="anexos-input-list" class="space-y-2"></div>
                <button type="button" onclick="addAnexoInput()" class="text-indigo-600 text-[10px] font-bold">+ AÑADIR ANEXO</button>
                <div class="flex gap-4 pt-6">
                    <button type="button" onclick="closeModal('modal-licitacion')" class="flex-1 py-4 text-xs font-bold text-slate-400">CANCELAR</button>
                    <button type="submit" class="flex-1 py-4 bg-slate-900 text-white rounded-xl text-xs font-bold uppercase">GUARDAR</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-anexos" class="hidden fixed inset-0 bg-white md:bg-slate-900/60 z-50 p-4 overflow-y-auto">
        <div class="max-w-2xl mx-auto bg-white rounded-3xl p-6 md:p-10 shadow-2xl min-h-full md:min-h-0">
            <div class="flex justify-between items-center mb-6">
                <h3 class="font-bold">DOCUMENTACIÓN</h3>
                <button onclick="closeModal('modal-anexos')" class="text-slate-400"><i data-lucide="x"></i></button>
            </div>
            <div id="anexos-list" class="space-y-4"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
