<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioHome SpA | Enterprise Hub</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script>
        const SB_URL = "https://ybwtjxgvicebwmyhkhda.supabase.co";
        const SB_KEY = "sb_publishable_Ae-JOXtX_fLpFTMgne_4Sw_jiGrdCMp";
        const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

        async function verifyAccess() {
            const { data: { session } } = await supabaseClient.auth.getSession();
            if (!session) {
                window.location.replace('login.html');
            } else {
                document.documentElement.classList.add('authorized');
            }
        }
        verifyAccess();
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* La página es invisible hasta que se confirma la sesión */
        html:not(.authorized) body { display: none !important; }
        body { font-family: 'Plus Jakarta Sans', sans-serif; transition: opacity 0.5s; }
        .view-section { display: none; }
        .view-section.active { display: block; animation: fadeIn 0.3s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        .sidebar-item { cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; transition: 0.2s; border-left: 4px solid transparent; }
        .sidebar-item.active { background: #f8fafc; color: #0f172a; border-left-color: #ef4444; font-weight: 700; }
        .status-badge { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 6px 12px; border-radius: 8px; border: 1px solid; cursor: pointer; appearance: none; }
        .search-bar { border: 1px solid #e2e8f0; transition: all 0.3s; }
        .search-bar:focus-within { border-color: #ef4444; box-shadow: 0 0 0 4px rgba(239, 68, 68, 0.05); }
    </style>
</head>
<body class="bg-[#fcfdfe] text-[#1e293b]">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-white border-r border-slate-200 flex flex-col z-20">
            <div class="p-8 mb-4 flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="w-10 h-10">
                <div>
                    <h1 class="font-bold text-sm tracking-tight text-slate-900 leading-none uppercase">CardioHome</h1>
                    <p class="text-[9px] text-red-500 font-bold uppercase mt-1 tracking-widest">Enterprise</p>
                </div>
            </div>

            <nav class="flex-1 px-4 space-y-1">
                <p class="px-4 text-[10px] font-bold text-slate-400 uppercase mb-2 tracking-widest">Gestión</p>
                <div onclick="switchView('dashboard')" id="nav-dashboard" class="sidebar-item active p-3 text-slate-500 hover:bg-slate-50">
                    <i data-lucide="layout-grid"></i> <span class="text-sm">Dashboard</span>
                </div>
                <p class="px-4 text-[10px] font-bold text-slate-400 uppercase mt-6 mb-2 tracking-widest">Repositorio</p>
                <div onclick="switchView('ordenes')" id="nav-ordenes" class="sidebar-item p-3 text-slate-500 hover:bg-slate-50">
                    <i data-lucide="shopping-cart"></i> <span class="text-sm">Órdenes</span>
                </div>
                <div onclick="switchView('legal')" id="nav-legal" class="sidebar-item p-3 text-slate-500 hover:bg-slate-50">
                    <i data-lucide="file-text"></i> <span class="text-sm">Legal</span>
                </div>
                <div onclick="switchView('staff')" id="nav-staff" class="sidebar-item p-3 text-slate-500 hover:bg-slate-50">
                    <i data-lucide="users"></i> <span class="text-sm">Staff Médico</span>
                </div>
                <div onclick="switchView('ia')" id="nav-ia" class="sidebar-item p-3 mt-6 text-indigo-600 bg-indigo-50/50 hover:bg-indigo-50 font-bold">
                    <i data-lucide="sparkles"></i> <span class="text-sm">Analizador IA</span>
                </div>
            </nav>

            <div class="p-6 border-t border-slate-50">
                <button onclick="logout()" class="flex items-center gap-3 text-xs font-bold text-slate-400 hover:text-red-500 transition">
                    <i data-lucide="power"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="flex-1 flex flex-col overflow-hidden">
            <header class="h-20 bg-white border-b flex items-center justify-between px-10 shadow-sm z-10">
                <h2 id="view-title" class="font-bold text-lg text-slate-800 uppercase tracking-tight">Dashboard</h2>
                <button onclick="openModal('modal-licitacion')" class="bg-[#0f172a] text-white px-6 py-2.5 rounded-lg text-xs font-bold hover:bg-slate-800 transition shadow-lg active:scale-95">
                    + Nueva Licitación
                </button>
            </header>

            <section id="view-dashboard" class="view-section active p-10 overflow-y-auto">
                <div class="mb-8 search-bar bg-white rounded-xl flex items-center px-4 py-1 shadow-sm max-w-2xl">
                    <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-3"></i>
                    <input type="text" id="search-licitaciones" oninput="filterLicitaciones()" placeholder="Buscar licitación por nombre o código ID..." class="w-full py-3 bg-transparent outline-none text-sm font-medium">
                </div>

                <div class="bg-white rounded-2xl border border-slate-100 shadow-xl overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-[10px] font-bold text-slate-400 uppercase tracking-widest border-b">
                            <tr>
                                <th class="px-8 py-5">Institución / ID</th>
                                <th class="px-8 py-5 text-center">Gestión Anexos</th>
                                <th class="px-8 py-5">Presupuesto</th>
                                <th class="px-8 py-5">Estatus</th>
                                <th class="px-8 py-5 text-center">Simulador</th>
                            </tr>
                        </thead>
                        <tbody id="tender-table-body" class="divide-y divide-slate-100 text-sm"></tbody>
                    </table>
                </div>
            </section>

            <section id="view-files" class="view-section p-10 overflow-y-auto">
                <div class="bg-white p-8 rounded-2xl border border-slate-100 mb-8 shadow-sm space-y-6">
                    <div class="flex flex-col md:flex-row justify-between items-center gap-6">
                        <div id="staff-folders" class="hidden flex gap-2">
                            <button onclick="changeFolder('staff/neurologia')" class="px-4 py-2 text-[10px] font-bold uppercase text-slate-400 border rounded-lg hover:border-slate-300">Neurología</button>
                            <button onclick="changeFolder('staff/pediatria')" class="px-4 py-2 text-[10px] font-bold uppercase text-slate-400 border rounded-lg hover:border-slate-300">Pediatría</button>
                        </div>
                        <div class="flex gap-4 w-full md:w-auto">
                            <input type="text" id="file-title" placeholder="Título descriptivo del documento" class="flex-1 p-3 bg-slate-50 border rounded-xl outline-none text-sm font-semibold">
                            <input type="file" id="file-input" class="hidden" accept=".pdf" onchange="uploadFile()">
                            <button onclick="triggerUpload()" class="bg-[#0f172a] text-white px-8 py-3 rounded-xl font-bold text-xs shadow-lg transition">CARGAR PDF</button>
                        </div>
                    </div>
                    <div class="search-bar bg-slate-50 rounded-xl flex items-center px-4 py-1 max-w-xl">
                        <i data-lucide="search" class="w-4 h-4 text-slate-400 mr-3"></i>
                        <input type="text" id="search-files" oninput="filterFiles()" placeholder="Buscar en este repositorio..." class="w-full py-2 bg-transparent outline-none text-sm">
                    </div>
                </div>
                <div id="file-grid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
            </section>

            <section id="view-ia" class="view-section p-10 overflow-y-auto">
                </section>
        </main>
    </div>

    <div id="modal-anexos" class="hidden fixed inset-0 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center z-50 p-6">
        <div class="bg-white rounded-[2.5rem] max-w-2xl w-full p-12 shadow-2xl relative">
            <button onclick="closeModal('modal-anexos')" class="absolute top-8 right-8 text-slate-300 hover:text-red-500 transition"><i data-lucide="x-circle"></i></button>
            <h3 class="text-2xl font-bold text-slate-900 mb-2 tracking-tight">Checklist de Requisitos</h3>
            <p id="anexos-lic-nombre" class="text-slate-400 text-[10px] font-black uppercase tracking-[0.2em] mb-10"></p>
            <div id="anexos-list" class="space-y-4 max-h-[50vh] overflow-y-auto pr-2"></div>
        </div>
    </div>

    <div id="modal-licitacion" class="hidden fixed inset-0 bg-slate-900/40 backdrop-blur-sm flex items-center justify-center z-50 p-6">
        <div class="bg-white rounded-[2rem] max-w-xl w-full p-12 shadow-2xl">
            <h3 class="text-xl font-bold text-slate-900 mb-8 uppercase tracking-tight">Nuevo Registro</h3>
            <form id="tender-form" class="space-y-5">
                <input type="text" id="t-nombre" placeholder="Nombre Institución" class="w-full p-4 bg-slate-50 border rounded-xl outline-none font-semibold" required>
                <div class="grid grid-cols-2 gap-4">
                    <input type="text" id="t-id" placeholder="ID Mercado Público" class="p-4 bg-slate-50 border rounded-xl outline-none font-semibold" required>
                    <input type="number" id="t-monto" placeholder="Presupuesto CLP" class="p-4 bg-slate-50 border rounded-xl outline-none font-semibold" required>
                </div>
                <div class="border-t border-slate-100 pt-6 mt-6">
                    <p class="text-[10px] font-bold text-slate-400 uppercase mb-4 tracking-widest">Definir Anexos Necesarios</p>
                    <div id="anexos-input-list" class="space-y-3">
                        <input type="text" placeholder="Ej: Anexo 1 (Identificación)" class="w-full p-3 bg-slate-50 border rounded-lg text-xs anexo-input font-bold uppercase">
                    </div>
                    <button type="button" onclick="addAnexoInput()" class="text-indigo-600 text-[10px] font-bold mt-4">+ AÑADIR OTRO REQUISITO</button>
                </div>
                <div class="flex gap-4 pt-10">
                    <button type="button" onclick="closeModal('modal-licitacion')" class="flex-1 text-slate-400 font-bold uppercase text-[10px]">Cancelar</button>
                    <button type="submit" class="flex-1 bg-slate-900 text-white p-4 rounded-xl font-bold uppercase text-[10px] shadow-xl">Guardar Licitación</button>
                </div>
            </form>
        </div>
    </div>

    <div id="modal-simulador" class="hidden fixed inset-0 bg-slate-900/95 backdrop-blur-md flex items-center justify-center z-50 p-6">
        <div class="bg-white rounded-[4rem] max-w-4xl w-full p-16 shadow-2xl flex flex-col md:flex-row gap-12 text-slate-800 relative">
            <button onclick="closeModal('modal-simulador')" class="absolute top-8 right-8 text-slate-300 hover:text-red-500 transition"><i data-lucide="x-circle"></i></button>
            <div class="flex-1 space-y-8">
                <h3 class="text-4xl font-black tracking-tighter" id="sim-nombre">Calculadora</h3>
                <div class="space-y-4">
                    <input type="number" id="gasto-medico" oninput="calculate()" class="w-full p-5 bg-slate-50 border-2 rounded-2xl outline-none font-bold text-xl" placeholder="Honorarios Médicos">
                    <input type="number" id="gasto-logistica" oninput="calculate()" class="w-full p-5 bg-slate-50 border-2 rounded-2xl outline-none font-bold text-xl" placeholder="Traslado y Otros">
                </div>
            </div>
            <div class="w-full md:w-80 bg-[#020617] rounded-[3rem] p-12 text-white text-center flex flex-col justify-center">
                <p class="text-slate-500 text-[10px] font-bold uppercase mb-4 tracking-widest">Utilidad Neta</p>
                <h4 class="text-5xl font-black text-green-400 tracking-tighter" id="sim-resultado">$0</h4>
                <div class="w-full bg-slate-800 h-2 rounded-full mt-10 overflow-hidden"><div id="sim-bar" class="bg-green-500 h-full transition-all duration-1000"></div></div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
