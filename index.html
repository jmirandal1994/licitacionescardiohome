<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CardioHome SpA | Gestión de Licitaciones</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .sidebar-item:hover { background-color: #3730a3; transition: 0.3s; }
        .status-badge { padding: 4px 12px; border-radius: 999px; font-size: 0.75rem; font-weight: 700; border: 1px solid; }
    </style>
</head>
<body class="bg-slate-50 text-slate-900 font-sans">

    <div class="flex h-screen overflow-hidden">
        <aside class="w-64 bg-indigo-900 text-white flex-shrink-0 flex flex-col">
            <div class="p-6 flex items-center gap-3">
                <img src="logo.png" alt="Logo" class="w-10 h-10 object-contain bg-white rounded-full p-1">
                <span class="text-xl font-bold tracking-tight">CARDIOHOME</span>
            </div>
            
            <nav class="flex-1 px-4 py-4 space-y-2">
                <button onclick="showSection('dashboard')" class="sidebar-item flex items-center gap-3 p-3 w-full rounded-lg bg-indigo-800">
                    <i data-lucide="layout-dashboard" class="w-5 h-5"></i> Dashboard
                </button>
                <button onclick="showSection('docs')" class="sidebar-item flex items-center gap-3 p-3 w-full rounded-lg">
                    <i data-lucide="folder-open" class="w-5 h-5"></i> Documentación
                </button>
                <button onclick="showSection('staff')" class="sidebar-item flex items-center gap-3 p-3 w-full rounded-lg">
                    <i data-lucide="users" class="w-5 h-5"></i> Staff Médico
                </button>
            </nav>

            <div class="p-4 border-t border-indigo-800">
                <button onclick="logout()" class="flex items-center gap-3 p-3 w-full hover:bg-red-600 rounded-lg transition">
                    <i data-lucide="log-out" class="w-5 h-5"></i> Cerrar Sesión
                </button>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto">
            <header class="bg-white border-b border-slate-200 px-8 py-4 flex justify-between items-center sticky top-0 z-10">
                <h2 class="text-xl font-semibold text-slate-700" id="section-title">Panel de Licitaciones</h2>
                <div class="flex items-center gap-4">
                    <span id="user-display" class="text-sm text-slate-500 font-medium">Cargando usuario...</span>
                </div>
            </header>

            <div class="p-8 space-y-8" id="content-dashboard">
                <div class="grid grid-cols-1 md:grid-cols-3 gap-6 text-center">
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs text-slate-400 uppercase font-bold">Total Adjudicado</p>
                        <h3 id="kpi-monto" class="text-3xl font-black text-green-600">$0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs text-slate-400 uppercase font-bold">Procesos Activos</p>
                        <h3 id="kpi-count" class="text-3xl font-black text-indigo-600">0</h3>
                    </div>
                    <div class="bg-white p-6 rounded-xl border border-slate-200 shadow-sm">
                        <p class="text-xs text-slate-400 uppercase font-bold">Estado del Sistema</p>
                        <h3 class="text-3xl font-black text-slate-800">ONLINE</h3>
                    </div>
                </div>

                <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
                    <table class="w-full text-left">
                        <thead class="bg-slate-50 text-slate-400 text-xs uppercase">
                            <tr>
                                <th class="px-6 py-4">Licitación</th>
                                <th class="px-6 py-4">Evaluación</th>
                                <th class="px-6 py-4">Monto</th>
                                <th class="px-6 py-4">Estado</th>
                                <th class="px-6 py-4 text-center">Simulador</th>
                            </tr>
                        </thead>
                        <tbody id="tender-table-body" class="divide-y divide-slate-100">
                            </tbody>
                    </table>
                </div>
            </div>

            <div id="modal-simulador" class="hidden fixed inset-0 bg-black/50 flex items-center justify-center z-50 p-4">
                <div class="bg-white rounded-2xl max-w-2xl w-full p-8 shadow-2xl">
                    <div class="flex justify-between items-center mb-6">
                        <h3 class="text-2xl font-bold text-indigo-900" id="sim-nombre">Simulador de Gastos</h3>
                        <button onclick="closeModal()" class="text-slate-400 hover:text-red-500"><i data-lucide="x-circle"></i></button>
                    </div>
                    <div class="grid md:grid-cols-2 gap-8">
                        <div class="space-y-4">
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase">Honorarios Médicos</label>
                                <input type="number" id="gasto-medico" oninput="calculate()" class="w-full p-2 border rounded" value="0">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase">Alojamiento y Traslado</label>
                                <input type="number" id="gasto-logistica" oninput="calculate()" class="w-full p-2 border rounded" value="0">
                            </div>
                            <div>
                                <label class="text-xs font-bold text-slate-500 uppercase">Otros Viáticos</label>
                                <input type="number" id="gasto-otros" oninput="calculate()" class="w-full p-2 border rounded" value="0">
                            </div>
                        </div>
                        <div class="bg-indigo-50 p-6 rounded-xl flex flex-col justify-center items-center">
                            <p class="text-sm font-bold text-indigo-600 uppercase">Margen de Ganancia</p>
                            <h4 class="text-4xl font-black" id="sim-resultado">$0</h4>
                            <div class="w-full bg-slate-200 h-3 rounded-full mt-6 overflow-hidden">
                                <div id="sim-bar" class="bg-green-500 h-full transition-all" style="width: 100%"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
