<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso Privado | CardioHome</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-indigo-900 flex items-center justify-center h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md text-center">
        <img src="logo.png" alt="Logo" class="w-20 mx-auto mb-4">
        <h1 class="text-2xl font-bold text-slate-800 mb-2">CardioHome SpA</h1>
        <p class="text-slate-500 mb-8 italic text-sm text-indigo-600 font-bold">Control de Documentación y Licitaciones</p>
        
        <form id="login-form" class="space-y-4">
            <input type="email" id="email" placeholder="Email de Usuario" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" required>
            <input type="password" id="password" placeholder="Contraseña" class="w-full p-3 border rounded-lg outline-none focus:ring-2 focus:ring-indigo-500" required>
            <button type="submit" class="w-full bg-indigo-600 text-white p-3 rounded-lg font-bold hover:bg-indigo-700 transition">ENTRAR AL SISTEMA</button>
        </form>
        <p id="error-msg" class="text-red-500 mt-4 text-sm hidden">Credenciales incorrectas o acceso denegado.</p>
    </div>

    <script>
        const SUPABASE_URL = "https://ybwtjxgvicebwmyhkhda.supabase.co";
        const SUPABASE_KEY = "sb_publishable_Ae-JOXtX_fLpFTMgne_4Sw_jiGrdCMp";
        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const { data, error } = await supabaseClient.auth.signInWithPassword({ email, password });

            if (error) {
                document.getElementById('error-msg').classList.remove('hidden');
            } else {
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
